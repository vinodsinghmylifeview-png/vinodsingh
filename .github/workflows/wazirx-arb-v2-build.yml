name: Build WazirX Arbitrage V2 APK

on:
  push:
    branches: [ wazirx-arb-v2-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source chunk 00a
        run: echo '519db008655f86242e4d9eb32793183f6268db70add47584eaa9e0f8fe27eefc  wazirx-v2-build/part00a.b64' | sha256sum -c -
      - name: Verify source chunk 00b
        run: echo '612c372535d00062e87faf41cba001c6094b942f0bff89df5492d9a5073db0ee  wazirx-v2-build/part00b.b64' | sha256sum -c -
      - name: Verify source chunk 01
        run: echo '37b8f3b76c04aae61823faa1018ef5c4506ce9ea0383ee5083c203cd59bd54ee  wazirx-v2-build/part01.b64' | sha256sum -c -
      - name: Verify source chunk 02
        run: echo 'c51ea5fce387c15ea7f00807f43ff91bf1a8985c38a2621ec3f3419c6e7a998e  wazirx-v2-build/part02.b64' | sha256sum -c -
      - name: Verify source chunk 03
        run: echo '48310140ca21e3804dfde55e424e34af9da702c8f1811933ee3e8917b42629a3  wazirx-v2-build/part03.b64' | sha256sum -c -
      - name: Verify source chunk 04
        run: echo 'c633ac9b60614ce200724ae1b59f78486885cf95a248302954ccdb8fe53b564d  wazirx-v2-build/part04.b64' | sha256sum -c -

      - name: Reconstruct V2 source archive
        shell: bash
        run: |
          cat wazirx-v2-build/part00a.b64 wazirx-v2-build/part00b.b64 wazirx-v2-build/part01.b64 wazirx-v2-build/part02.b64 wazirx-v2-build/part03.b64 wazirx-v2-build/part04.b64 | base64 --decode > WazirXArbAndroid-v2-source.zip
          echo 'd750dcf33132077f6b84c8db008bb539e6683ce0cdf961f48a8168f81daebd2e  WazirXArbAndroid-v2-source.zip' | sha256sum -c -
          unzip -t WazirXArbAndroid-v2-source.zip
          unzip -q WazirXArbAndroid-v2-source.zip
          test -f WazirXArbAndroid/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build V2 debug APK
        working-directory: WazirXArbAndroid
        run: gradle --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s WazirXArbAndroid/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose WazirXArbAndroid/app/build/outputs/apk/debug/app-debug.apk
          ls -lh WazirXArbAndroid/app/build/outputs/apk/debug/app-debug.apk
          sha256sum WazirXArbAndroid/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WazirXArb-V2-debug-apk
          path: WazirXArbAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

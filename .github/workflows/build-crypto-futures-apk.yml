name: Build Crypto Futures Signal APK
on:
  push:
    branches: [ crypto-futures-signal-app ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p CryptoFuturesSignal :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp CryptoFuturesSignal/app/build/outputs/apk/debug/app-debug.apk CryptoFuturesSignal-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CryptoFuturesSignal-v1
          path: CryptoFuturesSignal-v1.apk
          if-no-files-found: error
